  # ============================================================
  # BR-11 - Bảo mật và kiểm soát truy cập
  # ============================================================

  /auth/login:
    post:
      tags: [Authentication]
      summary: Xác thực người dùng
      description: FR-11.1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: user01
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Authentication]
      summary: Xem thông tin người dùng hiện tại
      description: FR-11.1, FR-11.2, FR-11.3
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/permissions:
    get:
      tags: [Authentication]
      summary: Kiểm tra quyền truy cập
      description: FR-11.2, FR-11.3
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Access permissions

  /audit-logs:
    get:
      tags: [Authentication]
      summary: Tra cứu nhật ký thao tác
      description: FR-11.7
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    action:
                      type: string
                    userId:
                      type: string
                    timestamp:
                      type: string
                      format: date-time

  # ============================================================
  # BR-12 - Khả năng mở rộng và ổn định
  # ============================================================

  /health:
    get:
      tags: [System]
      summary: Kiểm tra trạng thái hệ thống
      description: FR-12.1, FR-12.2, FR-12.3, FR-12.4
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    format: date-time

  # ============================================================
  # BR-13 - Khả năng mở rộng tính năng
  # ============================================================

  /services:
    get:
      tags: [System]
      summary: Danh sách loại dịch vụ
      description: FR-13.1
      responses:
        '200':
          description: Available services
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: CAR
                    name:
                      type: string
                      example: Car
    post:
      tags: [System]
      summary: Thêm loại dịch vụ
      description: FR-13.1
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  example: BIKE
                name:
                  type: string
                  example: Motorcycle
      responses:
        '201':
          description: Service created

  /payment-methods:
    get:
      tags: [Payments]
      summary: Danh sách phương thức thanh toán
      description: FR-13.2
      responses:
        '200':
          description: Payment methods

  /notification-channels:
    get:
      tags: [Notifications]
      summary: Danh sách kênh thông báo
      description: FR-13.3
      responses:
        '200':
          description: Notification channels

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    RideId:
      name: rideId
      in: path
      required: true
      schema:
        type: string
      example: RIDE001

    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: string
      example: DR001

    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
      example: VH001

    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
      example: PAY001

    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
      example: "2026-09-01"

    ToDate:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
      example: "2026-09-07"

  schemas:

    Location:
      type: object
      required: [address, latitude, longitude]
      properties:
        address:
          type: string
          example: Đại học Công nghiệp TP.HCM
        latitude:
          type: number
          format: double
          example: 10.8241
        longitude:
          type: number
          format: double
          example: 106.6877

    RideRequest:
      type: object
      required: [pickup, destination, vehicleType]
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          example: CAR

    CreateRideRequest:
      allOf:
        - $ref: '#/components/schemas/RideRequest'
        - type: object
          properties:
            paymentMethod:
              type: string
              enum: [CASH, CARD, E_WALLET]
              example: CASH

    RideValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
          example: true
        message:
          type: string
          example: Ride information is valid
        estimatedFare:
          type: number
          example: 75000
        estimatedDistanceKm:
          type: number
          example: 8.5
        estimatedDurationMinutes:
          type: integer
          example: 25

    FareEstimate:
      type: object
      properties:
        estimatedFare:
          type: number
          example: 75000
        estimatedDistanceKm:
          type: number
          example: 8.5
        estimatedDurationMinutes:
          type: integer
          example: 25

    Ride:
      type: object
      properties:
        id:
          type: string
          example: RIDE001
        customerId:
          type: string
          example: CUS001
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          example: CAR
        status:
          type: string
          enum: [SEARCHING, DRIVER_ASSIGNED, DRIVER_ARRIVING, IN_PROGRESS, COMPLETED, CANCELLED]
          example: SEARCHING
        driverId:
          type: string
          nullable: true
          example: DR001
        estimatedFare:
          type: number
          example: 75000
        finalFare:
          type: number
          nullable: true
          example: 78000
        createdAt:
          type: string
          format: date-time

    Driver:
      type: object
      properties:
        id:
          type: string
          example: DR001
        name:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        status:
          type: string
          enum: [AVAILABLE, BUSY, OFFLINE]
          example: AVAILABLE
        rating:
          type: number
          format: float
          example: 4.8
        location:
          $ref: '#/components/schemas/Location'

    DriverUpdateRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        licenseNumber:
          type: string

    CreateDriverRequest:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        licenseNumber:
          type: string
          example: B2-123456

    Vehicle:
      type: object
      properties:
        id:
          type: string
          example: VH001
        driverId:
          type: string
          example: DR001
        type:
          type: string
          example: CAR
        licensePlate:
          type: string
          example: 51A-12345
        model:
          type: string
          example: Toyota Vios
        status:
          type: string
          enum: [AVAILABLE, IN_USE, MAINTENANCE]
          example: AVAILABLE

    VehicleRequest:
      type: object
      required: [driverId, type, licensePlate]
      properties:
        driverId:
          type: string
          example: DR001
        type:
          type: string
          example: CAR
        licensePlate:
          type: string
          example: 51A-12345
        model:
          type: string
          example: Toyota Vios

    FareCalculationRequest:
      type: object
      properties:
        distanceKm:
          type: number
          example: 8.5
        durationMinutes:
          type: integer
          example: 25
        vehicleType:
          type: string
          example: CAR

    Fare:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        baseFare:
          type: number
          example: 20000
        distanceFare:
          type: number
          example: 45000
        timeFare:
          type: number
          example: 10000
        totalFare:
          type: number
          example: 75000
        currency:
          type: string
          example: VND

    RatingRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Tài xế rất thân thiện và chạy an toàn.

    Rating:
      type: object
      properties:
        id:
          type: string
          example: RAT001
        rideId:
          type: string
          example: RIDE001
        driverId:
          type: string
          example: DR001
        rating:
          type: integer
          example: 5
        comment:
          type: string
          example: Dịch vụ tốt.
        createdAt:
          type: string
          format: date-time

    PaymentRequest:
      type: object
      required: [rideId, method]
      properties:
        rideId:
          type: string
          example: RIDE001
        method:
          type: string
          enum: [CASH, CARD, E_WALLET]
          example: CASH
        amount:
          type: number
          example: 75000

    Payment:
      type: object
      properties:
        id:
          type: string
          example: PAY001
        rideId:
          type: string
          example: RIDE001
        method:
          type: string
          example: CASH
        amount:
          type: number
          example: 75000
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
          example: SUCCESS
        transactionId:
          type: string
          nullable: true
          example: TXN123456
        createdAt:
          type: string
          format: date-time

    NotificationRequest:
      type: object
      required: [userId, type, message]
      properties:
        userId:
          type: string
          example: CUS001
        rideId:
          type: string
          nullable: true
          example: RIDE001
        type:
          type: string
          example: DRIVER_ACCEPTED
        channel:
          type: string
          enum: [APP, SMS, EMAIL]
          example: APP
        message:
          type: string
          example: Tài xế đã nhận chuyến của bạn.

    Notification:
      type: object
      properties:
        id:
          type: string
          example: NOT001
        userId:
          type: string
          example: CUS001
        type:
          type: string
          example: DRIVER_ACCEPTED
        message:
          type: string
          example: Tài xế đã nhận chuyến.
        read:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: string
          example: CUS001
        name:
          type: string
          example: Tran Thi B
        phone:
          type: string
          example: "0912345678"
        email:
          type: string
          example: customer@example.com

    User:
      type: object
      properties:
        id:
          type: string
          example: USR001
        username:
          type: string
          example: user01
        role:
          type: string
          enum: [CUSTOMER, DRIVER, OPERATOR, ADMIN]
          example: CUSTOMER

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    ReportResponse:
      type: object
      properties:
        from:
          type: string
          format: date
          example: "2026-09-01"
        to:
          type: string
          format: date
          example: "2026-09-07"
        data:
          type: object
          additionalProperties: true
